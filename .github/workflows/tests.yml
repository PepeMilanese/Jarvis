name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # standard library only - nothing to install. The fake claude stands in for the real one, so no
      # model, no login and no Telegram bot are involved; the Whisper end-to-end tests skip without a model.
      - name: unit + end-to-end tests
        run: python -m unittest discover -s tests -v
